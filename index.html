<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HARISHMA M | Portfolio</title>
  <meta name="description" content="Portfolio of Harishma M - Data Science student. Explore it as a 3D cube or fly through it in a game world." />
  <meta name="theme-color" content="#04050b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="world.css" />
</head>
<body class="mode-cube">
  <canvas id="space" aria-hidden="true"></canvas>

  <!-- ENTRY GATE (also unlocks sound, which browsers only allow after a click) -->
  <div id="gate">
    <div class="g-in">
      <div class="g-logo">HM<i>.</i></div>
      <p class="g-sub">Data Science · Portfolio</p>
      <div class="g-btns">
        <button id="gSound" class="btn primary" type="button">🔊 Enter with sound</button>
        <button id="gSilent" class="btn" type="button">🔇 Enter silently</button>
      </div>
      <a class="g-classic" href="classic.html">Prefer a normal scrolling page? Open the classic view →</a>
    </div>
  </div>

  <header class="hud">
    <div class="brand" id="brand" title="HARISHMA M">
      <b><span class="full">HARISHMA M</span><span class="short">HM.</span></b><small>Data Science · Portfolio</small>
    </div>
    <nav class="tools" aria-label="Controls">
      <button id="bMode" class="tbtn" type="button" aria-label="Switch mode"><span class="ic">🚀</span><span class="lbl">Game mode</span></button>
      <button id="bSound" class="tbtn" type="button" aria-label="Toggle sound"><span class="ic">🔇</span><span class="lbl">Sound</span></button>
      <button id="bAch" class="tbtn" type="button" aria-label="Achievements"><span class="ic">🏆</span><span class="lbl" id="achCount">0/6</span></button>
      <a id="bClassic" class="tbtn" href="classic.html"><span class="ic">📄</span><span class="lbl">Classic view</span></a>
      <a id="bResume" class="tbtn solid" href="Harishma_M.pdf" download><span class="ic">⬇</span><span class="lbl">Résumé</span></a>
    </nav>
  </header>

  <main id="stage">
    <div id="scene" aria-label="3D cube. Drag to rotate, click a face to open it.">
      <div id="cube"></div>
      <div class="floor" aria-hidden="true"></div>
    </div>
  </main>

  <nav id="facenav" aria-label="Sections"></nav>
  <p id="hint"></p>
  <button id="dock" type="button" hidden></button>

  <!-- SECTION PANEL -->
  <div id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- ACHIEVEMENTS -->
  <aside id="ach" aria-label="Achievements" hidden></aside>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- HIDDEN TERMINAL -->
  <div id="term" role="dialog" aria-label="Terminal" aria-hidden="true">
    <div class="t-bar"><i></i><i></i><i></i><span>harishma@portfolio:~</span><button id="tClose" type="button" aria-label="Close terminal">✕</button></div>
    <div id="tout" class="t-out"></div>
    <label class="t-row"><span>❯</span><input id="tin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input" /></label>
  </div>

  <noscript><p style="position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#04050b;color:#fff;font-family:sans-serif;text-align:center;padding:24px">This interactive version needs JavaScript. <a style="color:#7cc4ff" href="classic.html">Open the classic view</a>.</p></noscript>
  <script src="world.js"></script>
</body>
</html>
